[theme]
base = "light"
primaryColor = "#315EFB"
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#202733"
borderColor = "#E4E7EC"
dataframeBorderColor = "#E4E7EC"
showWidgetBorder = true
baseRadius = "small"
font = "sans-serif"
baseFontSize = 15

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
